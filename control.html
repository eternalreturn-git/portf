<!DOCTYPE html>
<html lang="sv"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FAS — styr</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--bd:#232a31;--tx:#e7edf3;--dim:#8b97a3;--pos:#22c55e;--neg:#ef5a6f;--amber:#e0b341;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:560px;margin:0 auto}
h1{font-size:18px;margin:4px 0 12px;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
button{font:inherit;border:1px solid var(--bd);background:#1b2229;color:var(--tx);border-radius:10px;padding:12px 14px;width:100%;cursor:pointer}
button:active{opacity:.7}
.btn-pause{background:#3a2a12;border-color:#5a431d;color:var(--amber)}
.btn-resume{background:#123a1c;border-color:#1d5a2e;color:var(--pos)}
.btn-sell{background:#3a1620;border-color:#5a1d2e;color:var(--neg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.tk{font-weight:700}.muted{color:var(--dim);font-size:13px}
.sell{flex:0 0 96px}
input{font:inherit;background:#0e1216;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px;width:100%}
.st{font-size:13px;margin-top:8px;min-height:18px}
.ok{color:var(--pos)}.err{color:var(--neg)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--bd)}
.pill.on{color:var(--amber);border-color:#5a431d}.pill.off{color:var(--pos);border-color:#1d5a2e}
</style></head><body>
<h1>FAS — fjärrstyrning</h1>
<div id="patcard" class="card" style="display:none">
  <div class="lbl">GitHub-token (klistras in en gång, sparas bara här på mobilen)</div>
  <input id="pat" type="password" placeholder="github_pat_..." autocomplete="off">
  <div style="height:8px"></div>
  <button onclick="savePat()">Spara token</button>
  <div class="muted" style="margin-top:8px">Fin-PAT med Contents: Read and write, BARA detta repo.</div>
</div>
<div id="main" style="display:none">
  <div class="card">
    <div class="lbl">Nya köp <span id="pausePill" class="pill"></span></div>
    <button id="pauseBtn" onclick="togglePause()">—</button>
    <div id="pauseSt" class="st"></div>
  </div>
  <div class="card">
    <div class="lbl">Pågående trades (säljbara)</div>
    <div id="list"><div class="muted">Laddar…</div></div>
    <div id="sellSt" class="st"></div>
  </div>
  <button onclick="load()" style="margin-top:4px">Uppdatera</button>
  <div class="muted" style="margin-top:10px;text-align:center" id="stamp"></div>
</div>
<div id="boot" class="card"><div class="muted">Startar…</div></div>
<script>
var FR=new URLSearchParams((location.hash||'').replace(/^#/,''));
var TOK=FR.get('t')||'', KEY=FR.get('k')||'', SEC=FR.get('s')||'';
var OWNER=location.hostname.split('.')[0];
var NAME=(location.pathname.split('/').filter(Boolean)[0])||'';
var REPO=OWNER+'/'+NAME;
var PAT=null, DATA=null;
function $(id){return document.getElementById(id);}
function getPat(){ try{return localStorage.getItem('ctl_pat')||'';}catch(e){return '';} }
function savePat(){ var v=($('pat').value||'').trim(); if(!v)return; try{localStorage.setItem('ctl_pat',v);}catch(e){} PAT=v; $('patcard').style.display='none'; $('main').style.display='block'; load(); }
function b64uToBytes(b64u){ var b=b64u.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4)b+='='; var bin=atob(b); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
function b64ToBytes(b64){ var bin=atob(b64.replace(/\n/g,'')); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
async function decryptBlob(txt){ var data=b64ToBytes(txt); var key=await crypto.subtle.importKey('raw', b64uToBytes(KEY), {name:'AES-GCM'}, false, ['decrypt']); var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:data.slice(0,12)}, key, data.slice(12)); return JSON.parse(new TextDecoder().decode(pt)); }
async function hmacHex(msg){ var k=await crypto.subtle.importKey('raw', new TextEncoder().encode(SEC), {name:'HMAC',hash:'SHA-256'}, false, ['sign']); var s=await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)); var b=new Uint8Array(s),h=''; for(var i=0;i<b.length;i++)h+=('0'+b[i].toString(16)).slice(-2); return h; }
function rid(){ var u=new Uint8Array(12); crypto.getRandomValues(u); var h=''; for(var i=0;i<u.length;i++)h+=('0'+u[i].toString(16)).slice(-2); return h; }
function ghHeaders(){ return {Authorization:'token '+PAT, Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
async function load(){
  try{
    var r=await fetch('d/'+TOK+'.json?cb='+Date.now(),{cache:'no-store'});
    if(!r.ok){ $('boot').innerHTML='<div class="err">Kunde inte hämta data ('+r.status+').</div>'; return; }
    var txt=(await r.text()).trim();
    DATA = KEY ? await decryptBlob(txt) : JSON.parse(txt);
    $('boot').style.display='none'; $('main').style.display='block';
    renderPause(); renderList();
    $('stamp').textContent = 'Ögonblicksbild — '+(DATA.updated||'');
  }catch(e){ $('boot').innerHTML='<div class="err">Fel: '+e+'</div>'; }
}
function renderPause(){
  var paused = !!DATA.entries_paused;
  $('pausePill').textContent = paused?'PAUSADE':'AKTIVA';
  $('pausePill').className = 'pill '+(paused?'on':'off');
  var b=$('pauseBtn');
  b.textContent = paused?'Återuppta nya köp':'Pausa nya köp';
  b.className = paused?'btn-resume':'btn-pause';
}
function renderList(){
  var cs = DATA.closable||[];
  if(!cs.length){ $('list').innerHTML='<div class="muted">Inga pågående trades just nu.</div>'; return; }
  var h='';
  cs.forEach(function(c){
    h+='<div class="row"><div><div class="tk">'+(c.ticker||'?')+'</div><div class="muted">'+(c.qty||0)+' st'+(c.sim?' · sim':'')+'</div></div>'
      +'<button class="btn-sell sell" onclick="sellPos('+c.conId+',\''+(c.ticker||'')+'\')">Sälj</button></div>';
  });
  $('list').innerHTML=h;
}
async function sendCmd(cmd){
  cmd.id=rid(); cmd.ts=Date.now();
  var canon=[cmd.id, cmd.action, (cmd.conId!=null?cmd.conId:''), cmd.ts].join('|');
  cmd.sig=await hmacHex(canon);
  var api='https://api.github.com/repos/'+REPO+'/contents/cmd/commands.json';
  var sha=null, cmds=[];
  var g=await fetch(api+'?cb='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(g.status===200){ var j=await g.json(); sha=j.sha; try{ var dec=JSON.parse(decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))))); cmds=dec.cmds||[]; }catch(e){} }
  cmds.push(cmd); cmds=cmds.slice(-10);
  var body=JSON.stringify({cmds:cmds});
  var put={message:'cmd '+cmd.action, content:btoa(unescape(encodeURIComponent(body)))};
  if(sha)put.sha=sha;
  var p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(put)});
  if(!(p.status===200||p.status===201)){ var et=await p.text(); throw new Error('skrivfel '+p.status+' '+et.slice(0,80)); }
  return cmd.id;
}
async function waitAck(id, stEl){
  for(var i=0;i<12;i++){
    await new Promise(function(r){setTimeout(r,3000);});
    try{
      var g=await fetch('https://api.github.com/repos/'+REPO+'/contents/cmd/ack.json?cb='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
      if(g.status===200){ var j=await g.json(); var dec=JSON.parse(decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))))); var a=(dec.acks||[]).filter(function(x){return x.id===id;})[0];
        if(a){ stEl.innerHTML='<span class="'+(a.ok?'ok':'err')+'">'+(a.ok?'OK: ':'Avvisat: ')+(a.msg||'')+'</span>'; return; } }
    }catch(e){}
  }
  stEl.innerHTML='<span class="muted">Skickat — väntar på bekräftelse… (servern pollar var 20:e sek)</span>';
}
async function togglePause(){
  var st=$('pauseSt'); st.innerHTML='<span class="muted">Skickar…</span>';
  try{ var act = DATA.entries_paused?'resume_entries':'pause_entries'; var id=await sendCmd({action:act}); DATA.entries_paused=!DATA.entries_paused; renderPause(); waitAck(id, st); }
  catch(e){ st.innerHTML='<span class="err">'+e+'</span>'; }
}
async function sellPos(conId, tk){
  if(!confirm('Sälj pågående trade '+tk+'?'))return;
  var st=$('sellSt'); st.innerHTML='<span class="muted">Skickar sälj '+tk+'…</span>';
  try{ var id=await sendCmd({action:'close_position', conId:conId}); waitAck(id, st); }
  catch(e){ st.innerHTML='<span class="err">'+e+'</span>'; }
}
(function init(){
  if(!TOK||!SEC){ $('boot').innerHTML='<div class="err">Ogiltig länk (saknar nyckel). Hämta en ny styr-länk i appen.</div>'; return; }
  PAT=getPat();
  if(!PAT){ $('boot').style.display='none'; $('patcard').style.display='block'; return; }
  load();
})();
</script></body></html>
