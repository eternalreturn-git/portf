<title>Portfölj</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#040405; --panel:#161922; --panel2:#1b1f2a; --border:#262b38;
    --text:#e7eaf0; --dim:#9aa3b2; --pos:#22c55e; --neg:#ef4444; --accent:#60a5fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;padding:0 0 40px}
  .wrap{max-width:760px;margin:0 auto;padding:16px;width:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
         padding:6px 2px 14px;flex-wrap:wrap}
  h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
  .fresh{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--dim);
         font-family:var(--mono)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--pos);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .card .k{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .card .v{font-size:1.3rem;font-weight:700;margin-top:3px;font-family:var(--mono)}
  .card .s{font-size:.9rem;color:var(--dim);margin-top:3px;font-family:var(--mono)}
  /* Övriga partners (A, S) under ägarens kapital — små rader, som i GUI:t. */
  .partsub{margin-top:7px;font-size:.78rem;font-family:var(--mono);color:var(--text);line-height:1.5}
  .card.sm{padding:9px 12px}
  .card.sm .k{font-size:.64rem}
  .card.sm .v{font-size:.95rem;font-weight:600;color:var(--dim)}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .sec{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
  /* Breda tabeller (särsk. optioner, 9 kol) scrollar HORISONTELLT i sin egen box
     i stället för att tvinga hela sidan bred → sidan fyller alltid skärmbredden. */
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  thead th{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
           text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
  thead th:first-child{text-align:left}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono);white-space:nowrap}
  tbody td:first-child{text-align:left;font-family:inherit}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.05)}
  .tk{font-weight:700} .ty{font-size:.66rem;color:var(--dim);margin-left:6px}
  .tk-ny{color:#facc15;font-weight:800;font-size:.56rem;letter-spacing:.05em;margin-left:5px;padding:0 3px;border:0.5px solid #facc1566;border-radius:3px;background:rgba(250,204,21,.10);vertical-align:middle}
  .osub{font-size:.66rem;color:var(--dim);font-family:var(--mono);margin-top:2px;white-space:normal;line-height:1.35}
  /* IDAG / SEN START-växel (höger om sektionsrubriken) → byter de två P/L-kolumnerna så allt får plats utan scroll. */
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vsw{display:inline-flex;border:1px solid rgba(120,140,170,.4);border-radius:999px;overflow:hidden;flex:none}
  .vsw .vseg{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#9aa6b2;font-size:.68rem;
             font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 11px;cursor:pointer;white-space:nowrap;width:auto;margin:0}
  .vsw .vseg.on{background:#2f6fed;color:#fff}
  /* Optionskort: kontraktsinfo (MID·STRIKE·kurs·Slutdatum·dagar) på egen rad ÖVERST, värde/andel/P-L under. */
  .ocard{padding:10px 2px;border-bottom:1px solid var(--border)}
  .ocard:last-child{border-bottom:none}
  .ohead{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
  .oinfo{font-size:.72rem;color:var(--dim);font-family:var(--mono);line-height:1.45;margin-bottom:6px;white-space:normal}
  .oinfo b{color:var(--text);font-weight:700}
  .onums{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;font-family:var(--mono)}
  .onums .lbl{color:var(--dim);font-family:inherit;font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;margin-right:5px}
  /* Sorterbara kolumner (aktier) + sorteringsrad (optioner). */
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--text)} th.sorton{color:#2f6fed}
  .sortbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 2px 10px}
  .sortbar .slbl{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
  .sortbar .schip{appearance:none;-webkit-appearance:none;border:1px solid rgba(120,140,170,.3);background:transparent;
                  color:#9aa6b2;border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:600;cursor:pointer;width:auto;margin:0;white-space:nowrap}
  .sortbar .schip.on{background:#2f6fed;color:#fff;border-color:#2f6fed}
  /* Systemlogg-spegel: stort, lättscrollat fönster (60vh), monospace, färgkodat per rad. */
  .logbox{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:#0a0d12;border:1px solid var(--border,#1c2530);border-radius:10px;padding:10px 12px;
    font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;line-height:1.5}
  .logln{white-space:pre-wrap;word-break:break-word;padding:1px 0}
  .foot{margin-top:20px;font-size:.7rem;color:var(--dim);text-align:center;line-height:1.6}
  .msg{padding:40px 16px;text-align:center;color:var(--dim)}
  .chtog{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap}
  .chbtn{background:var(--panel2);border:1px solid var(--border);color:var(--dim);
         border-radius:8px;padding:4px 13px;font-size:.76rem;cursor:pointer;font-family:var(--mono)}
  .chbtn.on{background:var(--accent);border-color:var(--accent);color:#08111d;font-weight:700}
  /* SPY-toggle (samma stil som GUI:ts switchar) */
  .tgl{position:relative;display:inline-block;width:32px;height:18px;flex:none}
  .tgl input{opacity:0;width:0;height:0;position:absolute}
  .tgl .sl{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--border);border-radius:18px;transition:.15s;cursor:pointer}
  .tgl .sl:before{content:'';position:absolute;height:12px;width:12px;left:2px;top:2px;background:var(--dim);border-radius:50%;transition:.15s}
  .tgl input:checked + .sl{background:rgba(34,197,94,.18);border-color:#22c55e66}
  .tgl input:checked + .sl:before{transform:translateX(14px);background:#22c55e}
  .chx{text-align:right;font-size:.7rem;color:var(--dim);font-family:var(--mono)}
  .chwrap{position:relative;margin:2px 0;touch-action:none}
  .chmsg{padding:30px 12px;text-align:center;color:var(--dim);font-size:.8rem}
  .chcross{position:absolute;top:0;height:170px;width:1px;background:rgba(180,186,200,.55);pointer-events:none;display:none;z-index:2}
  .chcross-h{position:absolute;left:0;width:100%;height:1px;background:rgba(180,186,200,.55);pointer-events:none;display:none;z-index:2}
  .chtip{position:absolute;top:0;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:.74rem;font-family:var(--mono);font-weight:700;pointer-events:none;display:none;white-space:nowrap;z-index:3}
  .chtime{position:absolute;top:146px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:.7rem;color:var(--text);font-family:var(--mono);pointer-events:none;display:none;white-space:nowrap;z-index:3}
  .chdelta{font-size:.86rem;font-family:var(--mono);font-weight:700;text-transform:none;letter-spacing:0;margin-left:6px}
  /* Insättnings-/uttagsmarkörer på grafen (grön=in, bärnsten=ut). Samma design som GUI:ts köp/sälj-markörer. */
  .trade-mark{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:4;cursor:help}

<script>
  var T = new URLSearchParams(location.search).get('t');

  var SHARE_REPO = 'eternalreturn-git/portf';     // ägare/namn → datan hämtas via raw.githubusercontent (förbi Pages-bygget)
  // FIREBASE realtidskanal: prenumerera på datan (push, sub-sekund) i st.f. raw:s ~5-min-cache. GitHub kvar
  // som fallback. Web-config är publik (säkerheten ligger i RTDB-reglerna + att blobben är krypterad).
  var FB_CONFIG = {"apiKey": "AIzaSyBeRcYKniWFYjRn6tM2O6MoiBSh_kUKwW0", "authDomain": "eternalreturns.firebaseapp.com", "databaseURL": "https://eternalreturns-default-rtdb.europe-west1.firebasedatabase.app", "projectId": "eternalreturns", "storageBucket": "eternalreturns.firebasestorage.app", "messagingSenderId": "861303770274", "appId": "1:861303770274:web:26643afc14a3445123dbfb"};
  var _fbdb = null;
  try { if(window.firebase && FB_CONFIG && FB_CONFIG.databaseURL){ firebase.initializeApp(FB_CONFIG); _fbdb = firebase.database(); } } catch(e){ _fbdb = null; }
  function msg(t){ var m=document.getElementById('msg'); if(m) m.textContent=t; }
  function b64ToBytes(b64){ var bin=atob(b64); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function b64uToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return b64ToBytes(s); }
  async function decryptBlob(txt){
    var data=b64ToBytes(txt.trim());
    var key=await crypto.subtle.importKey('raw', b64uToBytes(K), {name:'AES-GCM'}, false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:data.slice(0,12)}, key, data.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function kr(v){ return (v==null)?'—':Math.round(v).toLocaleString('sv-SE'); }
  function pct(v,dec){ if(v==null) return '—'; var s=(v>=0?'+':'')+v.toFixed(dec==null?1:dec)+'%'; return s; }
  function cls(v){ return v==null?'':(v>=0?'pos':'neg'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function nyTag(tk){ var bt=window._shareBoughtToday||[]; return (bt.indexOf(String(tk==null?'':tk).toUpperCase())>=0) ? '<span class="tk-ny">NY</span>' : ''; }

  function freshness(epoch){
    if(epoch) window._shareEpoch = epoch;       // ny stämpel från en render → spara den senaste
    epoch = window._shareEpoch;                 // timern (anropar utan arg) + render använder senaste stämpeln
    var dot=document.getElementById('dot'), f=document.getElementById('fresh');
    if(!epoch){ dot.className='dot'; dot.style.background=''; f.textContent='okänd'; return; }
    var now=Date.now()/1000;
    var age=Math.max(0, Math.floor(now - epoch));
    var fbAge = window._lastFbTs ? (now - window._lastFbTs) : 1e9;   // sek sedan Firebase-strömmen senast levererade
    var snap=function(){ return new Date(epoch*1000).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}); };
    if(fbAge < 12 && window._ibConnected === false){  // strömmen flödar MEN heartbeaten säger IB frånkopplad → FRYST
      dot.className='dot'; dot.style.background='#f0a020';
      f.textContent='Fryst data — IB frånkopplad';
    } else if(fbAge < 12){                             // GRÖN: Firebase-strömmen flödar + IB ansluten → live
      dot.className='dot live'; dot.style.background='';
      f.textContent='Livestream';
    } else if(age >= 90){                              // RÖD: ingen färsk data på 90s → localservern är av
      dot.className='dot'; dot.style.background='#ef4444';
      f.textContent='Server offline, senaste ögonblicksbild: '+snap();
    } else {                                           // GUL: Firebase tyst men GitHub-fallback har (nyligen) data
      dot.className='dot'; dot.style.background='#f0a020';
      f.textContent='GitHub-källa';
    }
  }
  // IB GATEWAY-INDIKATOR: är servern uppkopplad mot IB just nu (= levande data) eller inte (= frusna/döda siffror)?
  // Live-strömmen bär ib_connected; vid frånkoppling pushas en heartbeat (ib_connected=false) så vi ser skillnad på
  // "IB tappade" och "servern av". Helt tyst ström (>90s) → servern troligen av.
  function ibStatus(){
    var dot=document.getElementById('ibdot'), s=document.getElementById('ibstat');
    if(!dot || !s) return;
    var now=Date.now()/1000;
    var fbAge = window._lastFbTs ? (now - window._lastFbTs) : 1e9;
    var ic = window._ibConnected;
    if(fbAge >= 90){                       // ingen färsk data alls → servern troligen av (IB-status okänd)
      dot.className='dot'; dot.style.background='#ef4444'; s.textContent='IB: okänt — server offline';
    } else if(ic === false){               // servern KÖR men IB frånkopplad → siffrorna är FRUSNA
      dot.className='dot'; dot.style.background='#ef4444'; s.textContent='IB Gateway: FRÅNKOPPLAD (fryst data)';
    } else if(ic === true && fbAge < 20){  // färsk ström + uppkopplad → levande data
      dot.className='dot live'; dot.style.background=''; s.textContent='IB Gateway: uppkopplad';
    } else {                               // mellanläge (väntar på färsk payload / ström hackar)
      dot.className='dot'; dot.style.background='#f0a020'; s.textContent='IB: kontrollerar…';
    }
  }
  setInterval(function(){ try{ freshness(); ibStatus(); }catch(e){} }, 1000);   // räkna upp åldern mellan strömtickarna → man ser exakt hur färsk den är + att den lever (0→1→0…)

  function byVal(a,b){ return (b.value_sek||0)-(a.value_sek||0); }
  function plkr(v){ return (v==null)?'—':((v>=0?'+':'−')+Math.round(Math.abs(v)).toLocaleString('sv-SE')); }
  function fmtDate(s){ s=String(s||''); return s.length===8 ? s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8) : '—'; }

  // === FJÄRRSTYRNING (bara ägaren, bara när länken bär control-secret 's') ===========
  var SEC = new URLSearchParams(location.hash.slice(1)).get('s') || '';   // signeringsnyckel, ej till servern
  var OWNER = location.hostname.split('.')[0];
  var NAME = (location.pathname.split('/').filter(Boolean)[0]) || '';
  var REPO = OWNER + '/' + NAME;
  function ctlGetPat(){ try{ return localStorage.getItem('ctl_pat')||''; }catch(e){ return ''; } }
  function ctlSavePat(){ var el=document.getElementById('ctlPat'); var v=(el&&el.value||'').trim(); if(!v) return; try{ localStorage.setItem('ctl_pat',v); }catch(e){} load(); }
  function ctlHeaders(){ return {Authorization:'token '+ctlGetPat(), Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
  async function ctlHmac(msg){ var k=await crypto.subtle.importKey('raw', new TextEncoder().encode(SEC), {name:'HMAC',hash:'SHA-256'}, false, ['sign']); var s=await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)); var b=new Uint8Array(s),h=''; for(var i=0;i<b.length;i++) h+=('0'+b[i].toString(16)).slice(-2); return h; }
  function ctlRid(){ var u=new Uint8Array(12); crypto.getRandomValues(u); var h=''; for(var i=0;i<u.length;i++) h+=('0'+u[i].toString(16)).slice(-2); return h; }
  async function ctlSend(cmd){
    cmd.id=ctlRid(); cmd.ts=Date.now();
    cmd.sig=await ctlHmac([cmd.id, cmd.action, (cmd.conId!=null?cmd.conId:''), (cmd.key!=null?cmd.key:''), cmd.ts].join('|'));
    // FIREBASE realtid: servern PRENUMERERAR på cmd/commands → kör kommandot inom sub-sekund. HMAC-signaturen
    // skyddar mot förfalskning oavsett transport. GitHub nedan = fallback om Firebase saknas/strular.
    var fbOk=false;
    if(_fbdb){ try{ await _fbdb.ref('cmd/commands').set({cmds:[cmd], ts:cmd.ts}); fbOk=true; }catch(e){} }
    var api='https://api.github.com/repos/'+REPO+'/contents/cmd/commands.json';
    // GitHub:s Contents-API kan servera en GAMMAL sha (eventual consistency, trots cache-bust) → PUT ger
    // 409 "is at X but expected Y". Hämta då om sha + försök igen (samma mönster som serversidan,
    // _gh_put_file). Annat fel (401/403 = fel/saknad token-access) → ge upp direkt, ingen poäng att loopa.
    var lastErr='skrivfel';
    for(var attempt=0; attempt<4; attempt++){
      var sha=null, cmds=[];
      var g=await fetch(api+'?cb='+Date.now(),{headers:ctlHeaders(),cache:'no-store'});
      if(g.status===200){ var j=await g.json(); sha=j.sha; try{ var dec=JSON.parse(decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))))); cmds=dec.cmds||[]; }catch(e){} }
      var mine=cmds.concat([cmd]).slice(-10);
      var put={message:'cmd '+cmd.action, content:btoa(unescape(encodeURIComponent(JSON.stringify({cmds:mine}))))};
      if(sha) put.sha=sha;
      var p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ctlHeaders()),body:JSON.stringify(put)});
      if(p.status===200||p.status===201) return cmd.id;
      var et=await p.text(); lastErr='skrivfel '+p.status+' '+et.slice(0,80);
      if(p.status===409 || p.status===422){ await ctlSleep(500+attempt*400); continue; }   // sha-race → hämta om + igen
      if(fbOk) return cmd.id;                                                                // Firebase tog emot → GitHub-fel spelar ingen roll
      throw new Error(lastErr);                                                              // 401/403/etc → ge upp
    }
    if(fbOk) return cmd.id;
    throw new Error(lastErr+' (gav upp efter omförsök)');
  }
  function ctlSleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  // Vänta på serverns ack.json (skrivs NÄR kommandot körts). Returnerar ack-objektet {ok,msg} eller
  // null om inget kom inom ~42 s. Visar löpande räknare så man ser ATT det jobbar (inte hängt).
  async function ctlWaitAck(id, label){
    // FIREBASE: läs cmd/ack i realtid var 1:e s (servern skriver direkt efter körning). Fallback: GitHub var 3:e s.
    var n=_fbdb?45:14, step=_fbdb?1000:3000;
    for(var i=0;i<n;i++){ await ctlSleep(step);
      ctlSetMsg('<span style="color:var(--dim)">'+(label||'Kommando')+': väntar på servern… '+Math.round((i+1)*step/1000)+' s'+(_fbdb?' (realtid)':' (pollar repot var 20:e sek)')+'</span>');
      if(_fbdb){
        try{ var s=await _fbdb.ref('cmd/ack').once('value'); var v=s.val(); if(v&&v.acks){ var a=v.acks.filter(function(x){return x.id===id;})[0]; if(a) return a; } }catch(e){}
      } else {
        try{ var g=await fetch('https://api.github.com/repos/'+REPO+'/contents/cmd/ack.json?cb='+Date.now(),{headers:ctlHeaders(),cache:'no-store'});
          if(g.status===200){ var j=await g.json(); var dec=JSON.parse(decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))))); var a=(dec.acks||[]).filter(function(x){return x.id===id;})[0];
            if(a) return a; }
        }catch(e){}
      }
    }
    return null;
  }
  // ---- Delad status + per-switch lås (pending) + "bekräftat"-override ----
  window._ctlPend = window._ctlPend || {};            // key → true medan vi väntar på serverns ack
  window._ctlMsg  = window._ctlMsg  || '';            // senaste statusrad (överlever omritning)
  window._ctlConfirmed = window._ctlConfirmed || {};  // field → {val,until}: ack:at läge tills payloaden hinner ikapp
  function ctlSetMsg(h){ window._ctlMsg=h; var e=document.getElementById('ctlSt'); if(e) e.innerHTML=h; }
  function ctlRenderCard(){ if(window._shareLast) render(window._shareLast); }   // rita om → speglar pending/serverläge
  // Switchens VISADE läge = serverns (payload) — MEN direkt efter ett ack visar vi det bekräftade
  // läget tills payloaden hunnit republiceras (annars skulle switchen "studsa tillbaka" 1 varv).
  function ctlState(d, field){
    var o=window._ctlConfirmed[field], sv=!!(d && d[field]);
    if(o){ if(Date.now()>o.until || sv===o.val){ delete window._ctlConfirmed[field]; return sv; } return o.val; }
    return sv;
  }
  var CTL_SW={
    ao:  {on:'autoorders_on', off:'autoorders_off', label:'Automatiska ordrar', field:'auto_orders'},
    arm: {on:'arm_on',        off:'arm_off',        label:'Säkerhetsswitch',    field:'armed'}
  };
  async function ctlSwitch(key){
    var cfg=CTL_SW[key]; if(!cfg) return;
    if(window._ctlPend[key]) return;                  // redan på väg → ignorera (switchen är låst)
    var cur=ctlState(window._shareLast||{}, cfg.field), want=!cur;
    window._ctlPend[key]=true; ctlRenderCard();        // lås switchen visuellt ("väntar…")
    ctlSetMsg('<span style="color:var(--dim)">'+cfg.label+': skickar ('+(want?'PÅ':'AV')+')…</span>');
    try{
      var id=await ctlSend({action: want?cfg.on:cfg.off});
      var a=await ctlWaitAck(id, cfg.label);
      if(a && a.ok){
        // VIKTIGT: mutera INTE window._shareLast här — override är den enda optimistiska källan.
        // (Satte vi shareLast=want skulle ctlState se sv===val och rensa override direkt → switchen
        // studsade tillbaka till den ännu icke-republicerade payloaden vid nästa load.) Override
        // hålls tills den republicerade payloaden visar samma värde (sv===val), eller 10 min.
        window._ctlConfirmed[cfg.field]={val:want, until:Date.now()+600000};
        ctlSetMsg('<span class="pos">'+cfg.label+': '+(want?'PÅ':'AV')+' ✓ (bekräftat av servern)</span>');
      } else if(a){ ctlSetMsg('<span class="neg">'+cfg.label+' avvisad: '+esc(a.msg||'')+'</span>'); }
      else { ctlSetMsg('<span style="color:#e0b341">'+cfg.label+': ingen bekräftelse på 42 s — switchen är upplåst igen, försök gärna på nytt. (Servern kan vara mitt i en trade och köra vid nästa poll; switchen speglar alltid serverns faktiska läge.)</span>'); }
    }catch(e){ ctlSetMsg('<span class="neg">'+cfg.label+': kunde inte skicka — '+esc(String(e))+'</span>'); }
    finally{ window._ctlPend[key]=false; ctlRenderCard(); setTimeout(load, 22000); }
  }
  async function ctlSell(key, tk){
    if(window._ctlPend.sell) return;
    // Bekräftelse med antal + P/L så man ser exakt vad som säljs (riktiga pengar).
    var _x=((window._shareLast&&window._shareLast.closable)||[]).filter(function(z){return z.key===key;})[0]||{};
    var _pl=[]; if(_x.pl_pct!=null) _pl.push((_x.pl_pct>=0?'+':'−')+Math.abs(_x.pl_pct).toFixed(2)+'%');
    if(_x.pl_sek!=null) _pl.push((_x.pl_sek>=0?'+':'−')+kr(Math.abs(_x.pl_sek)));
    if(!confirm('Sälj pågående trade '+tk+(_x.qty?' ('+_x.qty+' st)':'')+'?'+(_pl.length?'\nP/L just nu: '+_pl.join(' · '):''))) return;
    window._ctlPend.sell=true; ctlRenderCard();
    ctlSetMsg('<span style="color:var(--dim)">Skickar sälj '+esc(tk)+'…</span>');
    try{
      var id=await ctlSend({action:'close_position', key:key});
      var a=await ctlWaitAck(id, 'Sälj '+tk);
      if(a && a.ok) ctlSetMsg('<span class="pos">Utfört: '+esc(a.msg||'sålt')+' ✓</span>');
      else if(a) ctlSetMsg('<span class="neg">Avvisat: '+esc(a.msg||'')+'</span>');
      else ctlSetMsg('<span style="color:#e0b341">Skickat, ingen bekräftelse på 42 s — servern kör vid nästa poll (var 20:e sek).</span>');
    }catch(e){ ctlSetMsg('<span class="neg">Kunde inte skicka: '+esc(String(e))+'</span>'); }
    finally{ window._ctlPend.sell=false; ctlRenderCard(); setTimeout(load, 22000); }
  }
  // ENGÅNGS-ÅTGÄRD (ej toggle): återställ dygns-breaker / slå av nödstopp. Låser knappen tills ack.
  async function ctlAction(action, label){
    if(window._ctlPend[action]) return;
    window._ctlPend[action]=true; ctlRenderCard();
    ctlSetMsg('<span style="color:var(--dim)">'+esc(label)+': skickar…</span>');
    try{
      var id=await ctlSend({action:action});
      var a=await ctlWaitAck(id, label);
      if(a && a.ok) ctlSetMsg('<span class="pos">'+esc(label)+' ✓ ('+esc(a.msg||'utfört')+')</span>');
      else if(a) ctlSetMsg('<span class="neg">Avvisat: '+esc(a.msg||'')+'</span>');
      else ctlSetMsg('<span style="color:#e0b341">Skickat, ingen bekräftelse på 42 s — servern kör vid nästa poll.</span>');
    }catch(e){ ctlSetMsg('<span class="neg">Kunde inte skicka: '+esc(String(e))+'</span>'); }
    finally{ window._ctlPend[action]=false; ctlRenderCard(); setTimeout(load, 22000); }
  }
  // En självständig toggle-switch (speglar serverläge; dimmad+låst medan vi väntar på ack).
  function ctlSwitchHtml(key, label, sub, on, pend, syncing){
    var col = on?'#22c55e':'#5a6470', bg = on?'#11331c':'#161b21', knob = on?'right:3px':'left:3px';
    var pe = pend ? 'opacity:.45;pointer-events:none' : 'cursor:pointer';
    return '<div style="display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--bd,#232a31)">'
      + '<div onclick="ctlSwitch(\''+key+'\')" style="position:relative;flex:0 0 52px;height:30px;border-radius:16px;background:'+bg+';border:1px solid '+col+'66;'+pe+'">'
      +   '<span style="position:absolute;top:3px;'+knob+';width:22px;height:22px;border-radius:50%;background:'+col+';transition:all .15s"></span>'
      + '</div>'
      + '<div style="flex:1;min-width:0"><div style="font-weight:700">'+label
      +   (pend?' <span style="color:#e0b341;font-size:.8em">· väntar på servern…</span>':'')
      +   (!pend&&syncing?' <span style="color:#e0b341;font-size:.8em">· synkar…</span>':'')+'</div>'
      +   (sub?'<div style="color:var(--dim);font-size:.78em">'+sub+'</div>':'')+'</div>'
      + '</div>';
  }
  function ctlCardHtml(d){
    if(!(d.is_owner && SEC)) return '';        // bara ägaren, bara med control-länk
    if(!ctlGetPat()){
      return '<div class="sec">Fjärrstyrning</div><div class="tbl" style="padding:10px">'
        + '<div style="color:var(--dim);font-size:.82em;margin-bottom:6px">Klistra in din GitHub-token en gång (sparas bara här på enheten):</div>'
        + '<input id="ctlPat" type="password" placeholder="github_pat_..." autocomplete="off" style="width:100%;box-sizing:border-box;background:#0e1216;border:1px solid var(--bd,#232a31);color:inherit;border-radius:8px;padding:9px">'
        + '<div style="height:6px"></div><button onclick="ctlSavePat()" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd,#232a31);background:#1b2229;color:inherit">Spara token</button></div>';
    }
    // Visat läge = serverns ack (override) tills den långsamma Pages-payloaden hinner ikapp. Vi
    // visar INTE "synkar…" — ack:en ÄR serverns sanning, så switchen är klar direkt efter ✓ (att
    // hänga kvar mot Pages-payloaden gjorde att den såg "fast" ut i minuter helt i onödan).
    var aoOn = ctlState(d,'auto_orders'), armOn = ctlState(d,'armed');
    var cnt = (d.arm_count!=null?d.arm_count:0)+' / '+(d.arm_lock_after!=null?d.arm_lock_after:'—');
    // Säkerhetsswitchen disarmeras av TVÅ triggers: antal ordrar OCH dagsomsättning (köp+sälj). Visa båda;
    // re-arm (slå på switchen) nollställer båda. Omsättning visas bara när en gräns är satt (>0).
    var _toL = +d.turnover_limit||0, _toN = +d.turnover_today||0;

  // Systemloggens färgkodning — SAMMA nyckelords-regler som GUI:t (logColor i app.js). Emojis är redan

  function shareLogColor(l){

    if(/\bFILLED\b|\bFilled\b|\bSubmitted\b|\bKÖP\b|\bSÄLJ\b|Pengar säkrade|Validering godkänd|Återansluten|Ansluten till IB|godkänd/.test(l)) return '#22c55e';
    if(/Signal mottagen|Signature detected|LLM (redo|omladdad|AKTIV|aktiv|pinnad)|Bridge-tillägg AKTIVT|Bridge.*AKTIV|Server startad/.test(l)) return '#ff6fc7';
    return '#8a8f9f';

      + '<button class="vseg'+(st?' on':'')+'" onclick="shareSetVal(\'start\')">Sen start</button></span>';
  }

  function _shInitSort(k, def){ try{ var v=JSON.parse(localStorage.getItem(k)); if(v&&v.key) return v; }catch(e){} return def; }
  window._shStkSort = _shInitSort('sh_stk_sort', {key:'value_sek', dir:-1});
  window._shOptSort = _shInitSort('sh_opt_sort', {key:'value_sek', dir:-1});
  function shSort(which, key){
    var s = (which==='opt') ? window._shOptSort : window._shStkSort;
    if(s.key===key) s.dir = -s.dir; else { s.key=key; s.dir = (key==='ticker'||key==='expiry')?1:-1; }
    try{ localStorage.setItem(which==='opt'?'sh_opt_sort':'sh_stk_sort', JSON.stringify(s)); }catch(e){}
    if(window._shareLast) render(window._shareLast);
  }
  function _sortHoldings(arr, s){
    var key=s.key, dir=s.dir||-1, str=(key==='ticker'||key==='expiry'), a=arr.slice();
    a.sort(function(x,y){
      var vx=(key==='andel')?x.value_sek:x[key], vy=(key==='andel')?y.value_sek:y[key];
      var nx=(vx==null||vx===''), ny=(vy==null||vy==='');
      if(nx&&ny) return 0; if(nx) return 1; if(ny) return -1;          // null/tomt alltid sist
      if(str) return dir*String(vx).localeCompare(String(vy));
      return dir*((+vx)-(+vy));

  }

    var _mon=null, _monSub='';

      + '</div>';

      var v = snap.val(); if(!v) return; var txt = (typeof v==='string') ? v : (v.blob||'');
      if(!txt) return; txt = String(txt).trim();
      window._lastFbTs = Date.now()/1000;   // Firebase-strömmen levererade → freshness = Livestream
      Promise.resolve().then(function(){ return K ? decryptBlob(txt) : JSON.parse(txt); })
        .then(function(d){
          if(window._shareLast){ if(window._shareLast.chart && !d.chart) d.chart = window._shareLast.chart; if(window._shareLast.spy && !d.spy) d.spy = window._shareLast.spy; if(window._shareLast.fx && !d.fx) d.fx = window._shareLast.fx; }
          // 1s-LIVE-SERIE: spara värdet (kr) → 10m/1h-grafen kan rita en 1s-svans (mer datapunkter än value_logs 10s).
          if(d && d.equity_sek!=null){ var _ls=(window._shareLiveSeries||(window._shareLiveSeries=[])); var _nt=Math.floor(Date.now()/1000);
            if(!_ls.length || _nt> _ls[_ls.length-1].t){ _ls.push({t:_nt, eq:+d.equity_sek, eqPm:(d.equity_sek_pm!=null?+d.equity_sek_pm:+d.equity_sek)}); if(_ls.length>900) _ls.splice(0,_ls.length-900);
              // Spara (strypt ~3s) → överlever omladdning. ~900 punkter × ~20 B ≈ 18 kB, billigt.
              if(T && (!window._shareLiveSaveTs || _nt-window._shareLiveSaveTs>=3)){ window._shareLiveSaveTs=_nt; try{ localStorage.setItem('share_live_'+T, JSON.stringify(_ls)); }catch(e){} } } }
          render(d);
        })
        .catch(function(){});
    }); } catch(e){}
  }
  // Polla GitHub mer sällan när Firebase är på (bara som fallback om realtidskanalen tystnar).
  setInterval(load, _fbdb ? 120000 : 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
</script>
