<title>Portfölj</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#040405; --panel:#161922; --panel2:#1b1f2a; --border:#262b38;
    --text:#e7eaf0; --dim:#9aa3b2; --pos:#22c55e; --neg:#ef4444; --accent:#60a5fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;padding:0 0 40px}
  .wrap{max-width:760px;margin:0 auto;padding:16px;width:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
         padding:6px 2px 14px;flex-wrap:wrap}
  h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
  .fresh{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--dim);
         font-family:var(--mono)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--pos);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .card .k{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .card .v{font-size:1.3rem;font-weight:700;margin-top:3px;font-family:var(--mono)}
  .card .s{font-size:.9rem;color:var(--dim);margin-top:3px;font-family:var(--mono)}
  .card.sm{padding:9px 12px}
  .card.sm .k{font-size:.64rem}
  .card.sm .v{font-size:.95rem;font-weight:600;color:var(--dim)}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .sec{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
  /* Breda tabeller (särsk. optioner, 9 kol) scrollar HORISONTELLT i sin egen box
     i stället för att tvinga hela sidan bred → sidan fyller alltid skärmbredden. */
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  thead th{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
           text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
  thead th:first-child{text-align:left}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono);white-space:nowrap}
  tbody td:first-child{text-align:left;font-family:inherit}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.05)}
  .tk{font-weight:700} .ty{font-size:.66rem;color:var(--dim);margin-left:6px}
  .osub{font-size:.66rem;color:var(--dim);font-family:var(--mono);margin-top:2px;white-space:normal;line-height:1.35}
  .foot{margin-top:20px;font-size:.7rem;color:var(--dim);text-align:center;line-height:1.6}
  .msg{padding:40px 16px;text-align:center;color:var(--dim)}
  .chtog{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap}
  .chbtn{background:var(--panel2);border:1px solid var(--border);color:var(--dim);
         border-radius:8px;padding:4px 13px;font-size:.76rem;cursor:pointer;font-family:var(--mono)}
  .chbtn.on{background:var(--accent);border-color:var(--accent);color:#08111d;font-weight:700}
  .chx{text-align:right;font-size:.7rem;color:var(--dim);font-family:var(--mono)}
  .chwrap{position:relative;margin:2px 0;touch-action:none}
  .chmsg{padding:30px 12px;text-align:center;color:var(--dim);font-size:.8rem}
  .chcross{position:absolute;top:0;height:170px;width:1px;background:rgba(180,186,200,.55);pointer-events:none;display:none;z-index:2}
  .chtip{position:absolute;top:0;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:.74rem;font-family:var(--mono);font-weight:700;pointer-events:none;display:none;white-space:nowrap;z-index:3}
  .chtime{position:absolute;top:146px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:.7rem;color:var(--text);font-family:var(--mono);pointer-events:none;display:none;white-space:nowrap;z-index:3}
  .chdelta{font-size:.86rem;font-family:var(--mono);font-weight:700;text-transform:none;letter-spacing:0;margin-left:6px}
  @media(max-width:480px){ .cards{grid-template-columns:1fr 1fr} .card .v{font-size:1.15rem} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="pname">Portfölj</h1>
    <div class="fresh"><span class="dot" id="dot"></span><span id="fresh">laddar…</span></div>
  </header>
  <div id="content"><div class="msg" id="msg">Laddar…</div></div>
</div>
<script>
  var T = new URLSearchParams(location.search).get('t');
  var K = new URLSearchParams(location.hash.slice(1)).get('k');   // nyckel, ej till servern
  function msg(t){ var m=document.getElementById('msg'); if(m) m.textContent=t; }
  function b64ToBytes(b64){ var bin=atob(b64); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function b64uToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return b64ToBytes(s); }
  async function decryptBlob(txt){
    var data=b64ToBytes(txt.trim());
    var key=await crypto.subtle.importKey('raw', b64uToBytes(K), {name:'AES-GCM'}, false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:data.slice(0,12)}, key, data.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function kr(v){ return (v==null)?'—':Math.round(v).toLocaleString('sv-SE')+' kr'; }
  function pct(v,dec){ if(v==null) return '—'; var s=(v>=0?'+':'')+v.toFixed(dec==null?1:dec)+'%'; return s; }
  function cls(v){ return v==null?'':(v>=0?'pos':'neg'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function freshness(epoch){
    var dot=document.getElementById('dot'), f=document.getElementById('fresh');
    if(!epoch){ dot.className='dot'; f.textContent='okänd'; return; }
    var age=Math.max(0, Math.floor(Date.now()/1000 - epoch));
    if(age < 150){
      dot.className='dot live';
      f.textContent = 'Live — uppdaterad för ' + (age<60? age+' s':(Math.round(age/60)+' min')) + ' sedan';
    } else {
      dot.className='dot';
      var d=new Date(epoch*1000);
      f.textContent = 'Ögonblicksbild — ' + d.toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'});
    }
  }

  function byVal(a,b){ return (b.value_sek||0)-(a.value_sek||0); }
  function plkr(v){ return (v==null)?'—':((v>=0?'+':'−')+Math.round(Math.abs(v)).toLocaleString('sv-SE')); }
  function fmtDate(s){ s=String(s||''); return s.length===8 ? s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8) : '—'; }

  function render(d){
    document.getElementById('pname').textContent = d.name || 'Portfölj';
    document.title = d.name || 'Portfölj';
    // Belåningsgrad = belåning / bruttovärde (hävstångsnivå).
    var belPct = (d.gross_sek ? (d.belaning_sek/d.gross_sek*100).toFixed(2)+'%' : '—');
    var c = ''
      + '<div class="cards">'
      +   '<div class="card"><div class="k">Totalt eget kapital</div><div class="v">'+kr(d.equity_sek)+'</div></div>'
      +   '<div class="card"><div class="k">Utveckling på insatt kapital</div><div class="v '+cls(d.pnl_sek)+'">'+(d.pnl_sek!=null?(d.pnl_sek>=0?'+':'')+kr(d.pnl_sek):'—')+'</div>'
      +     '<div class="s '+cls(d.pnl_pct)+'">'+pct(d.pnl_pct)+'</div></div>'
      +   '<div class="card sm"><div class="k">Marknadsexponering</div><div class="v">'+kr(d.gross_sek)+'</div></div>'
      +   '<div class="card sm"><div class="k">Belåning</div><div class="v">'+kr(d.belaning_sek)+'</div><div class="s">'+belPct+'</div></div>'
      + '</div>';

    // Utvecklingsgraf (samma %-serie som GUI:t, utan cirkeldiagram). Tidknapparna
    // byter period lokalt — all data är redan inbäddad i payloaden.
    window._shareChart = d.chart || {};
    window._shareEquity = (typeof d.equity_sek==='number') ? d.equity_sek : null;
    if(!window._sharePeriod) window._sharePeriod = 'today';
    var hasChart = Object.keys(window._shareChart).some(function(k){ return (window._shareChart[k]||[]).length>=2; });
    if(hasChart){
      c += '<div class="sec">Portföljens utveckling <span id="chDelta" class="chdelta"></span></div>'
         + '<div id="chTog" class="chtog"></div>'
         + '<div id="chHi" class="chx"></div>'
         + '<div id="chWrap" class="chwrap"></div>'
         + '<div id="chLo" class="chx"></div>';
    }

    // Andel = innehavets värde / (alla innehav + saldo). Summan av alla andelar
    // (aktier + optioner + saldo) blir därför 100 %.
    var cash = d.cash_sek || 0;
    var base = (d.gross_sek||0) + cash;
    function apTxt(v){ if(!base) return '—'; var a=v/base*100; return (a>0&&a<0.1 ? a.toFixed(2) : a.toFixed(1))+'%'; }

    var all = (d.holdings||[]).filter(function(h){return h.value_sek!=null;});
    var stocks = all.filter(function(h){return h.type==='Stock';}).sort(byVal);
    var opts   = all.filter(function(h){return h.type!=='Stock';}).sort(byVal);

    if(stocks.length){
      c += '<div class="sec">Aktier ('+stocks.length+')</div>';
      c += '<div class="tbl"><table><thead><tr><th>Aktie</th><th>Värde</th><th>Andel</th><th>P/L %</th><th>P/L kr</th></tr></thead><tbody>';
      stocks.forEach(function(h){
        c += '<tr><td><span class="tk">'+esc(h.ticker)+'</span></td>'
           + '<td>'+kr(h.value_sek)+'</td>'
           + '<td>'+apTxt(h.value_sek)+'</td>'
           + '<td class="'+cls(h.pnl_pct)+'">'+pct(h.pnl_pct)+'</td>'
           + '<td class="'+cls(h.pnl_sek)+'">'+plkr(h.pnl_sek)+'</td></tr>';
      });
      c += '</tbody></table></div>';
    }
    if(opts.length){
      // Kompakt: kontraktsdetaljerna (strike · slutdatum · dgr · kurs) ligger som
      // underrad i första kolumnen → bara 5 kolumner = får plats i sidled på mobil.
      c += '<div class="sec">Optioner ('+opts.length+')</div>';
      c += '<div class="tbl"><table><thead><tr><th>Option</th><th>Värde</th><th>Andel</th><th>P/L %</th><th>P/L kr</th></tr></thead><tbody>';
      opts.forEach(function(h){
        var r = h.right==='P'?'PUT':(h.right==='C'?'CALL':'');
        var sub = [];
        if(h.strike!=null) sub.push('strike $'+h.strike);
        if(h.kurs!=null) sub.push('kurs $'+Number(h.kurs).toFixed(2));
        if(h.expiry) sub.push(fmtDate(h.expiry));
        if(h.dte!=null) sub.push(h.dte+' dgr');
        c += '<tr><td><span class="tk">'+esc(h.ticker)+'</span>'+(r?'<span class="ty">'+r+'</span>':'')
           + '<div class="osub">'+sub.join(' · ')+'</div></td>'
           + '<td>'+kr(h.value_sek)+'</td>'
           + '<td>'+apTxt(h.value_sek)+'</td>'
           + '<td class="'+cls(h.pnl_pct)+'">'+pct(h.pnl_pct)+'</td>'
           + '<td class="'+cls(h.pnl_sek)+'">'+plkr(h.pnl_sek)+'</td></tr>';
      });
      c += '</tbody></table></div>';
    }
    // Saldo (kontanter) som egen sektion → summan av alla andelar = 100 %.
    c += '<div class="sec">Saldo</div>';
    c += '<div class="tbl"><table><thead><tr><th>Kontanter</th><th>Värde</th><th>Andel</th></tr></thead><tbody>'
       + '<tr><td>Saldo</td><td>'+kr(cash)+'</td><td>'+apTxt(cash)+'</td></tr>'
       + '</tbody></table></div>';
    document.getElementById('content').innerHTML = c;
    shareRenderChart();
    freshness(d.updated_epoch);
  }

  function chPeriodLabel(p){ return {today:'Idag','1d':'1D','7d':'7D','1m':'1M',ytd:'YTD',y:'1Y',all:'Allt'}[p]||p; }
  function shareSetPeriod(p){ window._sharePeriod=p; shareRenderChart(); }
  function shareRenderChart(){
    var tog=document.getElementById('chTog'); if(!tog) return;   // ingen graf på denna sida
    var chart=window._shareChart||{}, per=window._sharePeriod||'today';
    var PERIODS=[['today','Idag'],['1d','1D'],['7d','7D'],['1m','1M'],['ytd','YTD'],['y','1Y'],['all','Allt']];
    tog.innerHTML = PERIODS.map(function(kv){
      return '<button class="chbtn'+(kv[0]===per?' on':'')+'" onclick="shareSetPeriod(\''+kv[0]+'\')">'+kv[1]+'</button>';
    }).join('');
    var key=(per==='1d')?'today':per, pts=chart[key]||[];
    // Spik-spärr (rullande median) — städa ev. glitch i den inbäddade datan så sidan
    // SJÄLVLÄKER vid ritning, även om den publicerade serien har en gammal spik. Bara
    // intradag-vyer (1M/YTD/1Å = dygnsvärden där en volatil dag är äkta).
    if((per==='today'||per==='1d'||per==='7d') && pts.length>=5){
      var _pv=pts.map(function(o){ return o.p; }), _N=_pv.length, _W=4;
      pts=pts.filter(function(o,i){
        var p=o.p, a=(i>0)?_pv[i-1]:null, b=(i<_N-1)?_pv[i+1]:null;
        if(a!=null && b!=null){     // (a) skarp V mot båda grannar (procentenheter)
          var da=p-a, db=p-b;
          if((da<-0.7&&db<-0.7)||(da>0.7&&db>0.7)) return false;
        }
        var win=_pv.slice(Math.max(0,i-_W),Math.min(_N,i+_W+1)).slice().sort(function(x,y){ return x-y; });
        if(win.length>=5){ var med=win[Math.floor(win.length/2)]; if(Math.abs(p-med)>0.9) return false; }  // (b) lokal median
        return true;
      });
    }
    var hi=document.getElementById('chHi'), lo=document.getElementById('chLo'),
        wrap=document.getElementById('chWrap'), delta=document.getElementById('chDelta');
    if(pts.length<2){ wrap.innerHTML='<div class="chmsg">Ingen data för "'+chPeriodLabel(per)+'" än.</div>';
      hi.textContent=''; lo.textContent=''; if(delta) delta.textContent=''; return; }
    var dayView=(per==='today'||per==='1d');
    var ps=pts.map(function(o){ return o.p; });
    var cur=ps[ps.length-1];
    var loV=Math.min.apply(null,ps.concat(0)), hiV=Math.max.apply(null,ps.concat(0));
    if(hiV-loV<0.2){ hiV+=0.1; loV-=0.1; }
    var W=1000,H=200,padY=14, t0,t1,guides=[], marketLines=[], xAt;
    function _p2(n){ return (n<10?'0':'')+n; }
    if(dayView){
      if(per==='1d'){ var d0=new Date(); d0.setHours(0,0,0,0); var _t=Math.floor(d0.getTime()/1000); if(_t>Math.floor(Date.now()/1000)) _t-=86400; t0=_t; t1=t0+86400; }
      else { t0=pts[0].t; t1=Math.max(pts[pts.length-1].t, Math.floor(Date.now()/1000)); }
      var span=Math.max(1,t1-t0);
      xAt=function(i){ return ((pts[i].t-t0)/span)*W; };
      // TIMTICK på varje hel timme (adaptivt steg så de inte trängs).
      var hrs=span/3600, hstep=hrs<=8?1:(hrs<=16?2:3);
      var hd=new Date(t0*1000); hd.setMinutes(0,0,0);
      if(hd.getTime()<t0*1000) hd.setHours(hd.getHours()+1);
      while(hd.getHours()%hstep!==0) hd.setHours(hd.getHours()+1);
      for(var tg=Math.floor(hd.getTime()/1000); tg<=t1; tg+=hstep*3600){ var dh=new Date(tg*1000);
        guides.push({x:((tg-t0)/span)*W, label:_p2(dh.getHours())+'.00'}); }
      // VERTIKALA marknads-linjer (02.00/10.00/15.30/22.00) om de ligger i vyn.
      [[2,0],[10,0],[15,30],[22,0]].forEach(function(hm){ var mdt=new Date(); mdt.setHours(hm[0],hm[1],0,0);
        var mtg=Math.floor(mdt.getTime()/1000); if(mtg>=t0&&mtg<=t1) marketLines.push(((mtg-t0)/span)*W); });
    } else {
      xAt=function(i){ return pts.length===1?0:(i/(pts.length-1))*W; };
      // DATUM/MÅNAD-etiketter vid gränsbyten (7D/1M = dag, YTD/1Y = månad, Allt = månad+år).
      var _mon=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
      var monthly=(per==='y'||per==='ytd'||per==='all'), prev=null, lastX=-999;
      for(var gi=0; gi<pts.length; gi++){ var gd=new Date(pts[gi].t*1000);
        var gk=monthly?(gd.getFullYear()+'-'+gd.getMonth()):(gd.getFullYear()+'-'+gd.getMonth()+'-'+gd.getDate());
        if(gk!==prev){ prev=gk; var gx=xAt(gi);
          if(gx-lastX>W*0.06){ var glbl=per==='all'?(_mon[gd.getMonth()]+' -'+String(gd.getFullYear()).slice(2)):(monthly?_mon[gd.getMonth()]:(gd.getDate()+' '+_mon[gd.getMonth()]));
            guides.push({x:gx, label:glbl}); lastX=gx; } } }
    }
    function y(p){ return padY+(1-(p-loV)/(hiV-loV))*(H-2*padY); }
    var lineD=ps.map(function(p,i){ return (i?'L':'M')+xAt(i).toFixed(1)+','+y(p).toFixed(1); }).join(' ');
    var zeroY=y(0).toFixed(1), col=cur>=0?'var(--pos)':'var(--neg)';
    var colHex=cur>=0?'#22c55e':'#ef4444';
    var x0=xAt(0).toFixed(1), xN=xAt(pts.length-1).toFixed(1);
    // Yta UNDER linjen med lodrät gradient: mättad närmast linjen, transparent nederst.
    var areaD='M'+x0+','+H+' '+ps.map(function(p,i){ return 'L'+xAt(i).toFixed(1)+','+y(p).toFixed(1); }).join(' ')+' L'+xN+','+H+' Z';
    var mktsvg=marketLines.map(function(mx){ return '<line x1="'+mx.toFixed(1)+'" y1="0" x2="'+mx.toFixed(1)+'" y2="'+H+'" stroke="rgba(124,130,144,.6)" stroke-width="1" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>'; }).join('');
    var glabels=guides.map(function(g){ return '<div style="position:absolute;bottom:1px;left:'+(g.x/W*100).toFixed(2)+'%;transform:translateX(-50%);font-size:.6rem;color:rgba(124,130,144,.9);font-family:var(--mono);pointer-events:none;background:rgba(4,4,5,.6);padding:0 3px;border-radius:3px;line-height:1.4">'+g.label+'</div>'; }).join('');
    wrap.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:170px;display:block">'
      +'<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="'+colHex+'" stop-opacity="0.075"/>'
      +'<stop offset="1" stop-color="'+colHex+'" stop-opacity="0"/></linearGradient></defs>'
      +mktsvg
      +'<path d="'+areaD+'" fill="url(#chartGrad)"/>'
      +'<path d="'+lineD+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke"/>'
      +'</svg><div class="chcross"></div><div class="chtip"></div><div class="chtime"></div>'+glabels;
    hi.textContent='Högst '+hiV.toFixed(2)+'%';
    lo.textContent='Lägst '+loV.toFixed(2)+'%';
    if(delta){ delta.textContent=(cur>=0?'+':'')+cur.toFixed(2)+'%'; delta.className='chdelta '+(cur>=0?'pos':'neg'); }
    // Hårkors: %-värde + klockslag vid hover/touch (delningssidan har bara %).
    window._shareHover = pts.map(function(o,i){ return {xf:xAt(i)/W, t:o.t, p:o.p}; });
    window._shareHoverPeriod = per;
    if(!wrap._crossBound){
      wrap._crossBound=true;
      wrap.addEventListener('mousemove', shareCross);
      wrap.addEventListener('mouseleave', shareCrossHide);
      wrap.addEventListener('touchstart', shareCross, {passive:false});
      wrap.addEventListener('touchmove', shareCross, {passive:false});
      wrap.addEventListener('touchend', shareCrossHide);
    }
  }
  var SV_MON=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  function shareFmtTime(t,period){ var d=new Date(t*1000), p2=function(n){ return ('0'+n).slice(-2); };
    if(period==='today'||period==='1d') return p2(d.getHours())+':'+p2(d.getMinutes());   // endast klockslag
    if(period==='all') return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());  // YYYY-mm-dd
    return d.getDate()+' '+SV_MON[d.getMonth()]; }                                          // "5 feb"
  function shareCross(e){
    var wrap=document.getElementById('chWrap'), hp=window._shareHover;
    if(!wrap||!hp||!hp.length) return;
    if(e.touches && e.cancelable) e.preventDefault();
    var rect=wrap.getBoundingClientRect();
    var clientX=e.touches? e.touches[0].clientX : e.clientX;
    var cx=Math.max(0, Math.min(rect.width, clientX-rect.left));
    var frac=rect.width? cx/rect.width : 0;
    var best=0, bd=9;
    for(var i=0;i<hp.length;i++){ var dd=Math.abs(hp[i].xf-frac); if(dd<bd){ bd=dd; best=i; } }
    var pt=hp[best], px=pt.xf*rect.width, sign=pt.p>=0;
    var cross=wrap.querySelector('.chcross'), tip=wrap.querySelector('.chtip'), tm=wrap.querySelector('.chtime');
    if(!cross||!tip||!tm) return;
    cross.style.display='block'; cross.style.left=px+'px';
    // Visa partnerns EGNA värde i kr vid den tidpunkten (eget kapital × periodens
    // NAV-utveckling) + procent. Exponerar aldrig portföljens totala kr.
    var txt=(sign?'+':'')+pt.p.toFixed(2)+'%';
    var pNow=hp[hp.length-1].p;
    if(window._shareEquity!=null && (1+pNow/100)!==0){
      txt = kr(window._shareEquity*(1+pt.p/100)/(1+pNow/100)) + ' · ' + txt;
    }
    tip.style.display='block'; tip.textContent=txt;
    tip.style.color=sign?'var(--pos)':'var(--neg)';
    tip.style.left=Math.max(64, Math.min(rect.width-64, px))+'px';
    tm.style.display='block'; tm.textContent=shareFmtTime(pt.t, window._shareHoverPeriod);
    tm.style.left=Math.max(24, Math.min(rect.width-24, px))+'px';
  }
  function shareCrossHide(){
    var wrap=document.getElementById('chWrap'); if(!wrap) return;
    ['.chcross','.chtip','.chtime'].forEach(function(s){ var el=wrap.querySelector(s); if(el) el.style.display='none'; });
  }

  function load(){
    if(!T){ msg('Ogiltig länk (saknar id).'); return; }
    fetch('d/'+encodeURIComponent(T)+'.json?_='+Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(txt){ txt=txt.trim(); return K ? decryptBlob(txt) : JSON.parse(txt); })
      .then(render)
      .catch(function(){ msg('Kunde inte hämta/avkoda data. Kontrollera länken.'); freshness(null); });
  }
  load();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
</script>
